<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Testando Requisições HTTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h2>Mini Testador de API</h2>
    <p>Preencha os campos abaixo e clique no verbo HTTP que deseja testar.</p>

    <!-- Campos de entrada genéricos -->
    <div class="row mb-4">
        <div class="col-2">
            <input type="text" id="inputId" class="form-control" placeholder="ID (Para PUT e DELETE)">
        </div>
        <div class="col-4">
            <input type="text" id="inputNome" class="form-control" placeholder="Nome">
        </div>
        <div class="col-4">
            <input type="text" id="inputIdade" class="form-control" placeholder="Idade">
        </div>
        <div class="col-2">
            <input type="text" id="inputRegistroAluno" class="form-control" placeholder="Registro do Aluno">
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-4">
            <input type="text" id="inputEmailInstitucional" class="form-control" placeholder="Email Institucional">
        </div>
        <div class="col-2">
            <input type="text" id="inputTurma" class="form-control" placeholder="Turma">
        </div>
        <div class="col-2">
            <input type="text" id="inputPeriodo" class="form-control" placeholder="Período">
        </div>
        <div class="col-4">
            <input type="text" id="inputApresentacao" class="form-control" placeholder="Apresentação">
        </div>
    </div>      
  

    <!-- Botões para cada Verbo HTTP -->
    <div class="mb-4">
        <button class="btn btn-primary" onclick="fazerGET()">GET (Buscar Todos)</button>
        <button class="btn btn-success" onclick="fazerPOST()">POST (Criar Novo)</button>
        <button class="btn btn-warning" onclick="fazerPUT()">PUT (Atualizar)</button>
        <button class="btn btn-danger" onclick="fazerDELETE()">DELETE (Apagar)</button>
    </div>

    <!-- Div onde vamos jogar o resultado cru (JSON) que vem do Spring Boot -->
    <h4>Resposta do Servidor (Spring Boot):</h4>
    <pre id="telaResposta" class="bg-dark text-light p-3 rounded" style="min-height: 100px;">
        Aguardando ação...
    </pre>

    <script src="js/app.js"></script>
</body>
</html>
